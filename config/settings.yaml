# Global, non-secret settings. Secrets live in .env / environment secrets.

project:
  name: PUSULA
  data_start: "2018-01-01"
  # "today" universe (dashboard)
  reference_date: "2026-11-01"
  # Start of the E4 backtest window; universe + energy selection use data up to here only.
  selection_date: "2025-11-03"
  random_seed: 42

# Data freeze (D-076): the paper uses data as of 2026-11-20. While enabled, the data update,
# PPK prefill and corporate-action proposals refuse to run, so the inputs of the running LLM
# experiments (E4, E5) cannot change. Lift it only after all LLM experiments are finished.
data_freeze:
  enabled: true
  as_of: "2026-11-20"
  reason: "LLM experiments E4/E5 running; paper data as of 2026-11-20"

paths:
  data_dir: data
  raw_dir: data/raw
  manual_dir: data/manual
  db_path: data/pusula.duckdb
  results_dir: results

llm:
  # Official training-data cutoff of the CONFIGURED model (D-062). nvidia/nemotron-3-ultra-550b-a55b
  # model card (build.nvidia.com/nvidia/nemotron-3-ultra-550b-a55b/modelcard, checked 2026-11-22):
  # "The post-training data has a cutoff date of May 2026. The pre-training data has a cutoff
  # date of September 2025." -> the later (post-training) date is used, conservatively.
  # (Previously Claude Sonnet/Haiku 5.5: Jun 2026.)
  training_cutoff: "2026-05-31"
  # Post-cutoff evaluation window starts the day after the cutoff month ends.
  post_cutoff_start: "2026-06-01"
  # Provider settings (D-054). Secrets (NVIDIA_API_KEY / LLM_API_KEY) live in .env or the cloud
  # network-secret store, never here. Any OpenAI-compatible endpoint works (NIM, Ollama, ...).
  provider: openai_compatible          # openai_compatible | anthropic | mock
  base_url: "https://integrate.api.nvidia.com/v1"
  model: "nvidia/nemotron-3-ultra-550b-a55b"        # analysts + decision (D-055)
  model_light: "nvidia/nemotron-3-ultra-550b-a55b"  # auditor consistency check (D-055)
  api_key_env: NVIDIA_API_KEY
  rpm: 35                    # client-side rate limit (free tier ~40 requests/min)
  max_concurrency: 4         # parallel requests in batch runs (still capped by rpm)
  timeout_s: 180
  max_tokens: 16384           # reasoning-on calls need room for hidden reasoning (D-068)
  temperature: 0.2
  json_mode: auto            # use response_format=json_object when the endpoint accepts it
  max_json_retries: 2
  max_backoff_retries: 6
  cache_path: data/llm_cache.sqlite
  extra_body: {}             # merged into every request
  # Lean (E4) calls: Nemotron 3 Ultra's reasoning switch off -> ~2 s instead of ~20-40 s per call,
  # same decisions in the comparison (D-061). Full-mode narratives keep reasoning on.
  extra_body_lean: {chat_template_kwargs: {enable_thinking: false}}

# Backup provider (D-075): prepared but NOT active. Setting enabled: true sends ALL agent calls to
# this model instead of llm.model. Only switch with the user's approval, and then rerun every E4
# variant and E5 with it, so all results come from one model (answers are cached per model).
llm_backup:
  enabled: false
  base_url: https://generativelanguage.googleapis.com/v1beta/openai/
  model: gemini-3.5-flash     # probe 2026-11-23: valid JSON 1st try, audit clean, ~9 s per lean call
  api_key_env: GEMINI_API_KEY # cloud: network secret for generativelanguage.googleapis.com
  rpm: 10                     # free-tier limits not verified (docs host unreachable from the cloud)
  extra_body: {}
  extra_body_lean: {}         # Nemotron's thinking switch must not be sent to Gemini

data_quality:
  # |daily simple return| above these thresholds is flagged for manual review (D-026).
  # Stocks: BIST main-market daily price limit is ±10%, +0.5pp for tick rounding.
  jump_thresholds: {stock: 0.105, index: 0.10, fx: 0.10, commodity: 0.25}
  stale_days: 5               # unchanged price for more than N trading days -> stale
  max_ffill_days_market: 5    # market series are forward-filled at most N business days

risk:
  calibration_window: 500      # trading days used to fit the models (D-031)
  min_history: 250             # fewer valid daily returns at as_of -> no report (D-031)
  max_gap_sessions: 5          # returns spanning a longer gap are dropped (D-032)
  n_paths: 10000               # forward Monte Carlo paths
  horizon_days: 63             # forward horizon (3 months) for fan chart / drawdown
  critic_paths: 200            # critic: paths simulated per model (D-034)
  critic_holdout_share: 0.2    # hold-out critic: fit on first 80%, score on last 20% (D-050)
  merton_threshold: 3.0        # jump = |r - median| > k * robust sigma (D-004)
  merton_min_jumps: 3          # fewer jumps -> Merton falls back to GBM
  evt: {min_history: 750, threshold_quantile: 0.95, run_length: 5, min_clusters: 20}  # D-036
  risk_level_cutoffs: [25, 50, 75]   # percentile cutoffs, evren içi göreli (D-037)

backtest:
  transaction_cost_bp: 10
  slippage_bp: 5
  auditor_sample_rate: 0.10
  long_sample_start: "2019-01-01"
